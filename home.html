<Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>To-Do List</h1>
        
        <div>
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <ul id="taskList"></ul>
        
        <div class="footer-info">
            <p>Tasks remaining: <span id="taskCount">0</span></p>
            <button id="clearBtn">Clear Completed Tasks</button>
        </div>
    </div>

    <dialog id="taskDialog">
        <form method="dialog">
            <h2>Add New Task</h2>
            <input type="text" id="taskName" placeholder="Enter task name..." class="dialog-input">
            <input type="date" id="taskDate" class="dialog-input">
            <div class="dialog-buttons">
                <button id="cancelBtn">Cancel</button>
                <button id="confirmBtn">Add</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
